name: publish-1.2.12

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6834-8209-8081-41d4297b48cb/raw?se=2026-10-05T05%3A58%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=76f644c9-de22-57c2-b70e-41af9044cd45&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T00%3A56%3A54Z&ske=2026-10-06T00%3A56%3A54Z&sks=b&skv=2026-02-06&sig=myykuH/JO4FCT08SJG2gL45CcoHv4HyVYxtkBkKXlPk%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.12.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.12
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.12 >/dev/null 2>&1; then
            gh release upload v1.2.12               release/JunggiManager-Setup-1.2.12.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.12               release/JunggiManager-Setup-1.2.12.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.12"               --notes "업체관리 표 간격 조정 및 로그인 사용설명서 링크 추가"               --target main               --latest
          fi
