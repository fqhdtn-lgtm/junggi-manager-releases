name: publish-1.2.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.2.11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ab50-8209-a7fb-8f2b98cccacd/raw?se=2026-10-04T23%3A41%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=6809a1d4-ed19-5b04-b3c2-eff252438b95&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T22%3A48%3A54Z&ske=2026-10-05T22%3A48%3A54Z&sks=b&skv=2026-02-06&sig=sEysxDnnrw6KL99mC%2B6098ra5//bSQvcWKer2iNZNi4%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          ls -lah release
          test -f release/JunggiManager-Setup-1.2.11.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json

      - name: Publish v1.2.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.11 >/dev/null 2>&1; then
            gh release upload v1.2.11 \
              release/JunggiManager-Setup-1.2.11.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --clobber
          else
            gh release create v1.2.11 \
              release/JunggiManager-Setup-1.2.11.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --title "중기메니저 1.2.11" \
              --notes "배차검색 우리 사무실만 필터 및 소속 회원명 표시"
          fi
