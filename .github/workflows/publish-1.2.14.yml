name: publish-1.2.14

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ade8-8209-b12f-7b0227c8d54c/raw?se=2026-10-05T06%3A45%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=5bde0f3b-41a0-5610-8ad6-9c614661772a&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T23%3A17%3A49Z&ske=2026-10-05T23%3A17%3A49Z&sks=b&skv=2026-02-06&sig=eNJMRtY1YzoHjP%2BeiAm7dzjVs1IBbf1f%2BVdR7FCGadY%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.14.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.14
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.14 >/dev/null 2>&1; then
            gh release upload v1.2.14               release/JunggiManager-Setup-1.2.14.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.14               release/JunggiManager-Setup-1.2.14.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.14"               --notes "최신 로컬 UI 복원 및 업데이트 버전 동기화 수정"               --target main               --latest
          fi
