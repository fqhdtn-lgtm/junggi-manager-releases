name: publish-1.2.15

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-39f4-8206-ac99-14457f3a96a2/raw?se=2026-10-06T06%3A21%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=183c1274-5594-58d5-95ec-d06b2f662fd5&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A11%3A52Z&ske=2026-10-07T04%3A11%3A52Z&sks=b&skv=2026-02-06&sig=OwN3hRpTzcX06Ip5ov/YOGFIsbL4yQaHwSzgXIq3lc4%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.15.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.15
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.15 >/dev/null 2>&1; then
            gh release upload v1.2.15 \
              release/JunggiManager-Setup-1.2.15.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --clobber
          else
            gh release create v1.2.15 \
              release/JunggiManager-Setup-1.2.15.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --title "중기메니저 1.2.15" \
              --notes "사이드바 선택 질감 및 업무현황 상단·상태카드 디자인 개선" \
              --target main \
              --latest
          fi
