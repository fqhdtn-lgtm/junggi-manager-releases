name: publish-1.2.17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-83a0-81f5-9a97-6dd054e26cb9/raw?se=2026-10-06T08%3A35%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=a17ed037-0941-516e-8f61-83b5bffc6ecc&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A42%3A35Z&ske=2026-10-07T01%3A42%3A35Z&sks=b&skv=2026-02-06&sig=hNfvdeoIncHnqqI3zfE3%2BWe%2BiRwpjqMzsx4vJGqeFSQ%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.17.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.17
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.17 >/dev/null 2>&1; then
            gh release upload v1.2.17               release/JunggiManager-Setup-1.2.17.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.17               release/JunggiManager-Setup-1.2.17.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.17"               --notes "배차검색 결과 폭 조정, PC 전화버튼 제거, 사이드바 원복, 업무현황 순위카드 복구, 질감 제거 및 성능 개선"               --target main               --latest
          fi
