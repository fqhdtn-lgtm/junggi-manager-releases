name: publish-1.2.18

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-208c-8206-b449-f62c68320861/raw?se=2026-10-06T09%3A16%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=3bd3a392-07d2-5a99-a97b-90e274f1181f&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A59%3A03Z&ske=2026-10-07T01%3A59%3A03Z&sks=b&skv=2026-02-06&sig=UJ8jKyJXFWrVbmPMs7mQH6Q9GsTi1xZeWfKHPVAA4/E%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.18.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.18
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.18 >/dev/null 2>&1; then
            gh release upload v1.2.18               release/JunggiManager-Setup-1.2.18.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.18               release/JunggiManager-Setup-1.2.18.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.18"               --notes "설정 카드 폭 정리, 업무현황 날씨 가로형 개선, 배차검색 및 사이드바·성능 개선"               --target main               --latest
          fi
