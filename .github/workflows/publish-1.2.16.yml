name: publish-1.2.16

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-231c-8209-afbb-eec8ca1b5483/raw?se=2026-10-06T07%3A15%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=0d3a3c39-7163-56f8-90dd-ed91d480d272&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A56%3A44Z&ske=2026-10-07T01%3A56%3A44Z&sks=b&skv=2026-02-06&sig=7jWA4CcIv0DhBfm8SetLG6L6dnp/czWjhG7B96Bdzxk%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.16.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.16
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.16 >/dev/null 2>&1; then
            gh release upload v1.2.16               release/JunggiManager-Setup-1.2.16.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.16               release/JunggiManager-Setup-1.2.16.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.16"               --notes "배차관리 UI 개선, 청록 테마·질감 통일, 설정 가입상품 카드 정렬 개선"               --target main               --latest
          fi
