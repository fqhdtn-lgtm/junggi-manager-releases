name: publish-1.2.11-final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.2.11-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/publish-1.2.11.yml').read_text()
          m = re.search(r"ARTIFACT_URL:\s*'([^']+)'", text)
          if not m:
              raise SystemExit('artifact url not found')
          print(m.group(1))
          PY
          )"
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.11.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.11
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.11 >/dev/null 2>&1; then
            gh release upload v1.2.11 \
              release/JunggiManager-Setup-1.2.11.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --clobber
          else
            gh release create v1.2.11 \
              release/JunggiManager-Setup-1.2.11.exe \
              release/SHA256SUMS.txt \
              release/update.json \
              --title "중기메니저 1.2.11" \
              --notes "배차검색 우리 사무실만 필터 및 소속 회원명 표시" \
              --target main \
              --latest
          fi
