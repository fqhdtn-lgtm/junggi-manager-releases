name: publish-1.2.13

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-fb9c-8211-ae85-9faf4dfcc718/raw?se=2026-10-05T06%3A18%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=892e35f2-38fe-5545-9191-b97a08c9f779&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A51%3A03Z&ske=2026-10-05T17%3A51%3A03Z&sks=b&skv=2026-02-06&sig=tmi2Rjxwr4IMziQ7fPMkgnwJoJ2rJQTYD1RtYkXarSY%3D'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d release
          test -f release/JunggiManager-Setup-1.2.13.exe
          test -f release/SHA256SUMS.txt
          test -f release/update.json
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish v1.2.13
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fqhdtn-lgtm/junggi-manager-releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.13 >/dev/null 2>&1; then
            gh release upload v1.2.13               release/JunggiManager-Setup-1.2.13.exe               release/SHA256SUMS.txt               release/update.json               --clobber
          else
            gh release create v1.2.13               release/JunggiManager-Setup-1.2.13.exe               release/SHA256SUMS.txt               release/update.json               --title "중기메니저 1.2.13"               --notes "업데이트 버전 동기화 오류 수정"               --target main               --latest
          fi
